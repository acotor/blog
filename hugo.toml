baseURL = "https://blog.ozee.cc/"
title = "OZ Blog"
copyright = "© OZ"
theme = "ink-free"
defaultContentLanguage = "zh"
hasCJKLanguage = true
[params]
mainSections = ["post"]
mode = "auto"
toc = "none"
maxTags = 7
wpm = 250
featherIconsCDN = false
commentsEnabled = true
[[params.social]]
name = "本钟"
icon = "message-circle"
url = "https://t.ozee.cc"
[[params.social]]
name = "RSS"
icon = "rss"
url = "/atom.xml"
[[menu.main]]
name = "首页"
url = "/"
weight = 1
[[menu.main]]
name = "归档"
url = "/archives/"
weight = 2
[[menu.main]]
name = "标签"
url = "/tags/"
weight = 2
[[menu.main]]
name = "关于"
url = "/post/about/"
weight = 3
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.extensions.typographer]
disable = true

[outputFormats.legacyfeed]
mediaType = "application/rss+xml"
baseName = "atom"
isPlainText = false
[outputs]
home = ["HTML", "RSS", "legacyfeed"]
