name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          version=0.169.0
          archive="hugo_${version}_linux-amd64.tar.gz"
          checksums="hugo_${version}_checksums.txt"
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          curl -fsSL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$base/$checksums" -o "$RUNNER_TEMP/$checksums"
          cd "$RUNNER_TEMP"
          grep "  ${archive}$" "$checksums" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Build public preview
        run: |
          hugo --minify --baseURL https://acotor.github.io/blog/
          python3 -c 'from pathlib import Path; [(p.write_text(p.read_text().replace("<head>", "<head><meta name=\"robots\" content=\"noindex,nofollow\">", 1))) for p in Path("public").rglob("*.html")]'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
