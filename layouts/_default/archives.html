<!DOCTYPE html>
<html lang="zh">
{{ partial "header.html" . }}
<body>
  <div class="container wrapper">
    {{ partial "head.html" . }}
    <main>
      <h1>归档</h1>
      {{ range where (where site.RegularPages "Section" "post") "Params.hidden" "ne" true }}
        {{ if ne .Type "page" }}<p><time>{{ .Date.Format "2006-01-02" }}</time> · <a href="{{ .RelPermalink }}">{{ .Title }}</a></p>{{ end }}
      {{ end }}
    </main>
  </div>
  {{ partial "footer.html" . }}
</body>
</html>
