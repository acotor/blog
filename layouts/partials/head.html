<div class="header">
  {{ with .Site.Params.Avatar }}<div class="avatar"><a href="{{ site.BaseURL }}"><img src="{{ . }}" alt="{{ site.Title }}" /></a></div>{{ end }}
  <h1 class="site-title"><a href="{{ site.BaseURL }}">{{ site.Title }}</a></h1>
  {{ with site.Params.subtitle }}<div class="site-description"><p>{{ . | markdownify }}</p></div>{{ end }}
  <nav class="nav" aria-label="主导航">
    <ul class="flat">{{ range site.Menus.main }}<li><a href="{{ .URL }}">{{ .Name }}</a></li>{{ end }}</ul>
  </nav>
</div>
